name: Python syntax check

on:
  pull_request:
    branches: [deploy/yemot-smart-search]
  push:
    branches: [deploy/yemot-smart-search]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python files
        run: python -m py_compile server.py voicepack.py
