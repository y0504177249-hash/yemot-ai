name: Validate Yemot AI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python server
        run: python -m py_compile server.py
      - name: Check admin JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline admin script found")
          Path("/tmp/admin.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/admin.js

      - name: Check personal-area JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("personal.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline personal-area script found")
          Path("/tmp/personal.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/personal.js

      - name: Test personal PIN hashing
        run: |
          python - <<'PY'
          import ast, base64, hashlib, hmac, os
          from pathlib import Path
          source = Path("server.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          names = {"pin_hash_value", "verify_personal_pin"}
          nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in names]
          if {n.name for n in nodes} != names:
              raise SystemExit("PIN functions missing")
          module = ast.Module(body=nodes, type_ignores=[])
          scope = {"os": os, "base64": base64, "hashlib": hashlib, "hmac": hmac}
          exec(compile(module, "server.py", "exec"), scope)
          encoded = scope["pin_hash_value"]("123456")
          assert encoded != "123456"
          assert scope["verify_personal_pin"]("123456", encoded)
          assert not scope["verify_personal_pin"]("654321", encoded)
          print("PIN hashing tests passed")
          PY
