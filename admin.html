<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ניהול העוזר הקולי</title>
<style>
  :root {
    --ink: #16222E; --mute: #566660; --paper: #EDF0EC; --panel: #FFFFFF; --rule: #CBD3CD;
    --ok: #2E9E6B; --warn: #D99A00; --off: #98A29C; --bad: #B63A2B;
    --act: #1D4E89; --act-ink: #FFFFFF; --field: #F7F9F7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E6ECE8; --mute: #9DAAA4; --paper: #0F171E; --panel: #16212A; --rule: #2A3945;
      --act: #7DB0EA; --act-ink: #0B1218; --field: #0F1920; --bad: #E4705F;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.55 system-ui, "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", Arial, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 8px 0 4px; font-weight: 700; }
  h2 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  p { margin: 0; }
  .sub { color: var(--mute); font-size: 14px; }
  section { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; margin-top: 18px; }
  header { padding-bottom: 4px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .bar .grow { flex: 1; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button {
    background: var(--act); color: var(--act-ink); border: 0; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; min-height: 40px;
  }
  button.quiet { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--act); outline-offset: 2px; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; background: var(--field); border: 1px solid var(--rule); border-radius: 8px;
    padding: 9px 10px; min-height: 40px;
  }
  textarea { min-height: 84px; resize: vertical; }
  label.f { display: block; margin-top: 14px; font-weight: 600; }
  label.f .sub { font-weight: 400; display: block; }
  .check { display: flex; gap: 8px; align-items: center; min-height: 36px; }
  .check input { width: 18px; height: 18px; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .line { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 16px 0; border-top: 1px solid var(--rule); }
  .line:first-of-type { border-top: 0; }
  .lamp { width: 16px; height: 16px; border-radius: 50%; margin-top: 7px; background: var(--off); flex: none; }
  .lamp.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
  .lamp.warn { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 25%, transparent); }
  .ident { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .phone { font-size: 22px; font-weight: 600; }
  .state { font-size: 14px; color: var(--mute); }
  .tools { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .keyrow { display: flex; gap: 8px; flex: 1 1 260px; }
  .keyrow input { flex: 1; min-width: 0; }
  .add { border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 16px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: end; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: right; padding: 8px 6px; border-top: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 600; color: var(--mute); border-top: 0; }
  .note { min-height: 24px; margin-top: 10px; font-size: 15px; }
  .note.bad { color: var(--bad); }
  .warnbox { border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 15px; }
  .login { max-width: 360px; margin: 14vh auto 0; }
  .scroll { overflow-x: auto; }
  @media (max-width: 520px) { .phone { font-size: 20px; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  var app = document.getElementById('app');
  var S = null;
  var googleLoginEnabled = false;
  var note = document.createElement('p');
  note.className = 'note'; note.setAttribute('role', 'status');

  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (c) {
        if (c == null || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      });
    }
    return e;
  }
  function say(text, bad) { note.textContent = text || ''; note.className = 'note' + (bad ? ' bad' : ''); }

  function api(method, path, body) {
    return fetch('/admin/api/' + path, {
      method: method, credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'admin' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) { showLogin(); throw new Error('auth'); }
        if (!r.ok) throw new Error(j.error || ('שגיאה ' + r.status));
        return j;
      });
    });
  }
  function act(label, fn) {
    say(label + '...');
    return fn().then(function (j) {
      say(j && j.warning ? j.warning : 'נשמר', !!(j && j.warning));
      return load();
    }).catch(function (e) { if (e.message !== 'auth') say(e.message, true); });
  }

  /* ---------- כניסה ---------- */
  function showLogin(msg) {
    var pw = h('input', { type: 'password', id: 'pw', autocomplete: 'current-password' });
    var out = h('p', { class: 'note bad', role: 'status' }, msg || '');
    var kids = [
      h('h1', null, 'ניהול העוזר הקולי')
    ];
    if (googleLoginEnabled) {
      kids.push(h('a', { href: '/admin/google/login', style: 'display:block; text-align:center; text-decoration:none; background:var(--act); color:var(--act-ink); border-radius:8px; padding:10px 14px; margin-top:14px; min-height:44px' }, 'התחברות עם Google'));
    }
    var go = function (ev) {
      ev.preventDefault();
      fetch('/admin/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'admin' },
        body: JSON.stringify({ password: pw.value })
      }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return [r, j]; }); })
        .then(function (a) {
          if (a[0].ok) load(); else out.textContent = a[1].error || 'הכניסה נכשלה';
        });
    };
    var formKids = kids.slice();
    if (true) formKids.push(
      h('label', { class: 'f', for: 'pw' }, 'סיסמת ניהול'),
      pw, out,
      h('div', { class: 'bar' }, h('button', { type: 'submit' }, 'כניסה'))
    );
    app.replaceChildren(h('form', { class: 'login', onsubmit: go }, formKids));
    pw.focus();
  }

  /* ---------- עזרים ---------- */
  var KIND = { chat: 'שיחה', lookup: 'חיפוש', mail: 'מייל' };
  function lampOf(c) {
    if (!c.enabled) return ['off', 'חסום'];
    if (c.state === 'quota') return ['warn', 'המכסה של המפתח נגמרה'];
    return ['ok', c.has_key ? 'מפתח אישי' : 'משתמש במפתח הראשי'];
  }
  function keyBox(placeholder, btnLabel, onSave) {
    var inp = h('input', { type: 'password', autocomplete: 'off', placeholder: placeholder, 'aria-label': placeholder });
    return h('div', { class: 'keyrow' }, inp,
      h('button', { class: 'quiet', type: 'button', onclick: function () { if (inp.value.trim()) onSave(inp.value.trim()); else say('הדבק מפתח קודם', true); } }, btnLabel));
  }
  function testKey(payload) {
    say('בודק מפתח...');
    return api('POST', 'test_key', payload).then(function (j) { say(j.ok ? 'המפתח עובד' : 'המפתח לא עבד: ' + j.error, !j.ok); })
      .catch(function (e) { if (e.message !== 'auth') say(e.message, true); });
  }

  /* ---------- כותרת ---------- */
  function header() {
    var st = S.store;
    var kids = [
      h('h1', null, 'העוזר הקולי'),
      h('p', { class: 'sub' },
        'שיחות פעילות: ' + S.active_calls + '  |  הגדרות נשמרות ב' + (st.source === 'google' ? 'חשבון גוגל שלך' : 'שרת (זמני)') +
        '  |  פועל ' + Math.max(1, Math.round(S.uptime / 60)) + ' דקות')
    ];
    if (st.error) kids.push(h('div', { class: 'warnbox' }, 'השמירה הקבועה לא זמינה כרגע (' + st.error + '). ההגדרות יישמרו רק עד הפעלה מחדש של השרת. עדכן את הסקריפט בגוגל לפי ההוראות כדי שיישמרו תמיד.'));
    kids.push(h('div', { class: 'bar' },
      h('button', { class: 'quiet', onclick: function () { say('מרענן...'); load().then(function () { say('עודכן'); }); } }, 'רענון'),
      h('button', { class: 'quiet', onclick: function () { act('מאפס מכסות', function () { return api('POST', 'reset_quota'); }); } }, 'איפוס סימוני מכסה'),
      h('a', { href: '/admin/yiddish', style: 'display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--rule);border-radius:8px;padding:8px 14px;min-height:40px;color:var(--ink)' }, 'שיחה ביידיש'),
      h('span', { class: 'grow' }),
      h('button', { class: 'quiet', onclick: function () { api('POST', 'logout').then(function () { showLogin(); }); } }, 'יציאה')));
    kids.push(note);
    return h('header', null, kids);
  }

  /* ---------- התראות מנהל ---------- */
  function notificationsPanel() {
    var items = S.notifications || [];
    if (!items.length) return h('div');
    return h('section', null,
      h('h2', null, 'התראות מערכת'),
      h('p', { class: 'sub' }, 'נדרשת פעולה כדי להמשיך להקצות מכסות API אישיות.'),
      items.map(function (item) {
        return h('article', { class: 'line' },
          h('span', { class: 'lamp warn', 'aria-hidden': 'true' }),
          h('div', null,
            h('strong', null, item.message),
            h('div', { class: 'sub' }, (item.phone ? 'מספר: ' + item.phone + ' · ' : '') + new Date(item.created_at).toLocaleString('he-IL'))),
          h('button', { class: 'quiet', onclick: function () {
            act('מסמן שטופל', function () { return api('POST', 'notifications/' + item.id); });
          } }, 'סימון כטופל'));
      }));
  }

  /* ---------- קווים ומפתחות ---------- */
  function callersPanel() {
    var d = S.default_key;
    var main = h('div', { class: 'line' },
      h('span', { class: 'lamp ' + (d.state === 'quota' ? 'warn' : 'ok'), 'aria-hidden': 'true' }),
      h('div', null,
        h('div', { class: 'ident' }, h('span', { class: 'phone' }, 'מפתח ראשי'), h('span', { class: 'mono' }, d.mask || '—')),
        h('div', { class: 'state' }, (d.state === 'quota' ? 'המכסה נגמרה' : 'פעיל') + '. משמש כל מי שאין לו מפתח אישי.')),
      h('div', { class: 'tools' }, h('button', { class: 'quiet', onclick: function () { testKey({ phone: '' }); } }, 'בדיקת מפתח')));

    var rows = S.callers.map(function (c) {
      var lp = lampOf(c);
      var tools = [];
      tools.push(keyBox(c.has_key ? 'מפתח חדש להחלפה' : 'הדבק מפתח אישי', 'שמירת מפתח', function (k) {
        act('שומר מפתח', function () { return api('PUT', 'caller', { phone: c.phone, name: c.name, key: k }); });
      }));
      tools.push(h('label', { class: 'check' },
        h('input', { type: 'checkbox', checked: c.enabled, onchange: function (e) { act('מעדכן', function () { return api('PUT', 'caller', { phone: c.phone, name: c.name, enabled: e.target.checked }); }); } }),
        'מורשה להשתמש'));
      if (S.settings.mail_mode === 'listed') {
        tools.push(h('label', { class: 'check' },
          h('input', { type: 'checkbox', checked: c.mail, onchange: function (e) { act('מעדכן', function () { return api('PUT', 'caller', { phone: c.phone, name: c.name, mail: e.target.checked }); }); } }),
          'מורשה לגשת למיילים'));
      }
      if (c.has_key || c.from_env) tools.push(h('button', { class: 'quiet', onclick: function () { testKey({ phone: c.phone }); } }, 'בדיקת מפתח'));
      if (c.has_key) tools.push(h('button', { class: 'quiet', onclick: function () { act('מסיר מפתח', function () { return api('PUT', 'caller', { phone: c.phone, name: c.name, clear_key: true }); }); } }, 'הסרת המפתח'));
      tools.push(h('button', { class: 'danger', onclick: function () {
        if (confirm('למחוק את ' + (c.name || c.phone) + '?')) act('מוחק', function () { return api('DELETE', 'caller/' + encodeURIComponent(c.phone)); });
      } }, 'מחיקה'));
      return h('div', { class: 'line' },
        h('span', { class: 'lamp ' + lp[0], 'aria-hidden': 'true' }),
        h('div', null,
          h('div', { class: 'ident' }, h('span', { class: 'phone num' }, c.phone), c.name ? h('span', null, c.name) : null, c.mask ? h('span', { class: 'mono' }, c.mask) : null),
          h('div', { class: 'state' }, lp[1] + (c.from_env ? ' (מוגדר בשרת)' : ''))),
        h('div', { class: 'tools' }, tools));
    });

    var f = { phone: h('input', { type: 'text', inputmode: 'numeric', id: 'np', autocomplete: 'off', placeholder: '0501234567' }),
              name: h('input', { type: 'text', id: 'nn', autocomplete: 'off', placeholder: 'למשל אמא' }),
              key: h('input', { type: 'password', id: 'nk', autocomplete: 'off', placeholder: 'אפשר להוסיף אחר כך' }),
              mail: h('input', { type: 'checkbox', id: 'nm' }) };
    var add = h('div', { class: 'add' },
      h('div', null, h('label', { for: 'np', class: 'sub' }, 'מספר טלפון'), f.phone),
      h('div', null, h('label', { for: 'nn', class: 'sub' }, 'שם'), f.name),
      h('div', null, h('label', { for: 'nk', class: 'sub' }, 'מפתח Gemini אישי'), f.key),
      h('label', { class: 'check' }, f.mail, 'מורשה לגשת למיילים'),
      h('button', { onclick: function () {
        act('מוסיף', function () { return api('PUT', 'caller', { phone: f.phone.value.trim(), name: f.name.value.trim(), key: f.key.value.trim(), mail: f.mail.checked, enabled: true }); });
      } }, 'הוספת קו'));

    return h('section', null,
      h('h2', null, 'קווים ומפתחות'),
      h('p', { class: 'sub' }, 'לכל מספר אפשר לתת מפתח Gemini משלו, כדי שלכל אדם תהיה מכסה נפרדת. מספר שאינו ברשימה משתמש במפתח הראשי.'),
      main, rows, add);
  }

  function uploadMusic(input, lang) {
    var file = input.files && input.files[0];
    if (!file) { say('בחר תחילה קובץ MP3', true); return; }
    if (!/\\.mp3$/i.test(file.name) || file.size > 15 * 1024 * 1024) {
      say('יש לבחור קובץ MP3 עד 15MB', true); return;
    }
    var data = new FormData(); data.append('file', file);
    say('מעלה מנגינה לימות המשיח...');
    fetch('/admin/api/music/upload?lang=' + lang, { method: 'POST', credentials: 'same-origin', body: data })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'ההעלאה נכשלה'); return j; }); })
      .then(function (j) { say(j.warning || 'המנגינה הועלתה ונשמרה בהצלחה'); input.value = ''; load(); })
      .catch(function (e) { say(e.message, true); });
  }

  /* ---------- הגדרות ---------- */
  function settingsPanel() {
    var s = S.settings;
    var contactsText = Object.keys(s.mail_contacts || {}).map(function (k) { return k + ' = ' + s.mail_contacts[k]; }).join('\n');
    var el = {
      model: h('input', { type: 'text', id: 'sm', value: s.model, autocomplete: 'off' }),
      voice: h('input', { type: 'checkbox', id: 'sv', checked: s.voice_enabled }),
      dvoice: h('select', { id: 'sdv' }, S.voices.map(function (v) { return h('option', { value: v, selected: v === s.default_voice }, v); })),
      mode: h('select', { id: 'smm' },
        [['all', 'כל מי שמתקשר'], ['listed', 'רק קווים שסימנתי'], ['off', 'אף אחד']].map(function (o) { return h('option', { value: o[0], selected: o[0] === s.mail_mode }, o[1]); })),
      contacts: h('textarea', { id: 'sc' }, contactsText),
      music: h('input', { type: 'text', id: 'smu', value: s.music_file, autocomplete: 'off', placeholder: 'נתיב ישן (אופציונלי)' }),
      musicHe: h('input', { type: 'file', id: 'smh', accept: '.mp3,audio/mpeg' }),
      musicYi: h('input', { type: 'file', id: 'smy', accept: '.mp3,audio/mpeg' }),
      greet: h('textarea', { id: 'sg' }, s.greeting),
      extra: h('textarea', { id: 'se' }, s.extra_instructions)
    };
    var save = function () {
      var contacts = {}, bad = null;
      el.contacts.value.split('\n').forEach(function (line) {
        if (!line.trim()) return;
        var i = line.indexOf('=');
        if (i < 1) { bad = line; return; }
        contacts[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      });
      if (bad) { say('שורה לא תקינה באנשי הקשר: ' + bad + ' (כתוב שם = כתובת)', true); return; }
      act('שומר הגדרות', function () {
        return api('PUT', 'settings', {
          model: el.model.value.trim(), voice_enabled: el.voice.checked, default_voice: el.dvoice.value,
          mail_mode: el.mode.value, mail_contacts: contacts, music_file: el.music.value.trim(),
          greeting: el.greet.value.trim(), extra_instructions: el.extra.value.trim()
        });
      });
    };
    var kids = [
      h('h2', null, 'הגדרות'),
      h('label', { class: 'f', for: 'sm' }, 'מודל', h('span', { class: 'sub' }, 'שם מודל Gemini לתשובות. אם הוא לא קיים, השרת עובר אוטומטית למודל אחר.')), el.model,
      h('label', { class: 'check', for: 'sv', style: 'margin-top:14px' }, el.voice, 'קול אנושי חם (Gemini)'),
      h('label', { class: 'f', for: 'sdv' }, 'קול ראשון בשיחה', h('span', { class: 'sub' }, 'מתקשר יכול להחליף קול באמצעות האמירה "החלף קול".')), el.dvoice
    ];
    if (S.features.email) {
      kids.push(
        h('label', { class: 'f', for: 'smm' }, 'מי יכול לקרוא ולשלוח מיילים', h('span', { class: 'sub' }, 'המיילים הם של חשבון הגוגל שלך. בחירה ב"כל מי שמתקשר" נותנת גישה לכל מי שנכנס לשלוחה.')), el.mode,
        h('label', { class: 'f', for: 'sc' }, 'אנשי קשר לשליחה מהירה', h('span', { class: 'sub' }, 'שורה לכל איש קשר, בפורמט שם = כתובת. שליחה לאחרים נעשית לפי חיפוש בתיבה או כתובת מוקראת.')), el.contacts);
    }
    kids.push(
      h('label', { class: 'f', for: 'smh' }, 'מנגינת המתנה – שלוחה 8 (עברית)', h('span', { class: 'sub' }, 'בחר קובץ MP3 עד 15MB. ההעלאה תתבצע ישירות לימות המשיח.')), el.musicHe,
      h('button', { type: 'button', onclick: function () { uploadMusic(el.musicHe, 'he'); } }, 'העלאת מנגינה לעברית'),
      h('label', { class: 'f', for: 'smy' }, 'מנגינת המתנה – שלוחה 1.1 (יידיש)'), el.musicYi,
      h('button', { type: 'button', onclick: function () { uploadMusic(el.musicYi, 'yi'); } }, 'העלאת מנגינה ליידיש'),
      h('label', { class: 'f', for: 'smu' }, 'נתיב מנגינה ישן (אופציונלי)'), el.music,
      h('label', { class: 'f', for: 'sg' }, 'ברכת פתיחה'), el.greet,
      h('label', { class: 'f', for: 'se' }, 'הנחיות נוספות לעוזר', h('span', { class: 'sub' }, 'למשל סגנון דיבור או נושאים להימנע מהם. עד 600 תווים.')), el.extra,
      h('div', { class: 'bar' }, h('button', { onclick: save }, 'שמירת הגדרות')));
    return h('section', null, kids);
  }

  /* ---------- ארכיון תמלולים ---------- */
  function transcriptsPanel() {
    var phone = h('input', { type: 'text', placeholder: 'מספר טלפון', inputmode: 'numeric' });
    var name = h('input', { type: 'text', placeholder: 'שם מתקשר' });
    var from = h('input', { type: 'date', 'aria-label': 'מתאריך' });
    var to = h('input', { type: 'date', 'aria-label': 'עד תאריך' });
    var results = h('div', { class: 'sub' }, 'הזן מסנן ולחץ על חיפוש כדי להציג תמלולים.');
    var search = function () {
      results.replaceChildren(h('p', { class: 'sub' }, 'מחפש...'));
      var q = new URLSearchParams();
      if (phone.value.trim()) q.set('phone', phone.value.trim());
      if (name.value.trim()) q.set('name', name.value.trim());
      if (from.value) q.set('from', from.value);
      if (to.value) q.set('to', to.value);
      q.set('limit', '1000');
      api('GET', 'transcripts?' + q.toString()).then(function (data) {
        results.replaceChildren();
        if (!data.items.length) { results.append(h('p', { class: 'sub' }, 'לא נמצאו תמלולים מתאימים.')); return; }
        data.items.forEach(function (item) {
          var date = new Date(item.created_at).toLocaleString('he-IL');
          results.append(h('article', { class: 'line' },
            h('span', { class: 'lamp ok', 'aria-hidden': 'true' }),
            h('div', null,
              h('div', { class: 'ident' },
                h('strong', null, item.name || 'ללא שם'),
                h('span', { class: 'num' }, item.phone),
                h('span', { class: 'sub' }, date)),
              h('p', { style: 'margin-top:8px; white-space:pre-wrap' }, 'המתקשר: ' + item.heard),
              h('p', { style: 'margin-top:6px; white-space:pre-wrap' }, 'העוזר: ' + item.answer)
            )));
        });
      }).catch(function (e) {
        results.replaceChildren(h('p', { class: 'note bad' }, e.message));
      });
    };
    return h('section', null,
      h('h2', null, 'ארכיון תמלולים'),
      h('p', { class: 'sub' }, 'חיפוש לפי מספר, שם וטווח תאריכים. התוצאות מוצגות רק למנהל המחובר.'),
      h('div', { class: 'add' },
        h('div', null, h('label', { class: 'sub' }, 'מספר טלפון'), phone),
        h('div', null, h('label', { class: 'sub' }, 'שם'), name),
        h('div', null, h('label', { class: 'sub' }, 'מתאריך'), from),
        h('div', null, h('label', { class: 'sub' }, 'עד תאריך'), to),
        h('button', { onclick: search }, 'חיפוש')),
      results);
  }

  /* ---------- יומן ---------- */
  function eventsPanel() {
    var rows = S.events.map(function (e) {
      var t = new Date(e.t * 1000).toLocaleString('he-IL', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
      return h('tr', null,
        h('td', null, t),
        h('td', null, h('span', { class: 'num' }, e.phone)),
        h('td', null, KIND[e.kind] || e.kind),
        h('td', null, e.sec + ' שנ׳'),
        h('td', null, e.ok ? (e.voice ? 'הצליח' : 'הצליח, בקול רגיל') : (e.err || 'נכשל')));
    });
    return h('section', null,
      h('h2', null, 'שיחות אחרונות'),
      h('p', { class: 'sub' }, 'בארכיון נשמרים תמלילי חילופי הדברים בין המתקשר לעוזר, לצד פרטי השיחה.'),
      rows.length ? h('div', { class: 'scroll' }, h('table', null,
        h('thead', null, h('tr', null, ['זמן', 'מספר', 'סוג', 'משך', 'תוצאה'].map(function (x) { return h('th', null, x); }))),
        h('tbody', null, rows))) : h('p', { class: 'sub', style: 'margin-top:10px' }, 'עוד אין שיחות מאז הפעלת השרת. חייג למספר והקש 8.'));
  }


  function keyPoolPanel() {
    var label = h('input', { type: 'text', placeholder: 'תיאור המפתח (למשל קו א)' });
    var key = h('textarea', { placeholder: 'הדבק כאן מפתח Gemini', rows: 2 });
    var status = h('p', { class: 'sub' }, 'המפתחות נשמרים מוצפנים. הערך המלא לא יוצג לאחר השמירה.');
    var rows = h('div', null);
    function load() {
      api('GET', 'state').then(function (d) {
        rows.replaceChildren();
        (d.key_pool || []).forEach(function (k) {
          var line = h('article', { class: 'line' },
            h('div', null,
              h('strong', null, k.label || 'ללא תיאור'),
              h('div', { class: 'sub' }, 'מזהה: ' + k.fingerprint + ' · ' + (k.assigned_phone ? 'מוקצה לקו ' + k.assigned_phone : 'פנוי') + (k.disabled ? ' · מושבת' : ''))
            ),
            h('button', { class: 'quiet', onclick: function () {
              api('PUT', 'key_pool/' + k.id, { disabled: !k.disabled }).then(load).catch(function (e) { status.textContent = e.message; });
            } }, k.disabled ? 'הפעל' : 'השבת')
          );
          rows.append(line);
        });
        if (!d.key_pool || !d.key_pool.length) rows.append(h('p', { class: 'sub' }, d.key_pool_error || 'המאגר עדיין ריק.'));
      }).catch(function (e) { status.textContent = e.message; });
    }
    function add() {
      var value = key.value.trim();
      if (!value) { status.textContent = 'יש להדביק מפתח לפני השמירה.'; return; }
      status.textContent = 'שומר מפתח מוצפן...';
      api('POST', 'key_pool', { label: label.value.trim(), key: value }).then(function () {
        key.value = ''; label.value = '';
        status.textContent = 'המפתח נשמר במאגר באופן מוצפן.';
        load();
      }).catch(function (e) { status.textContent = e.message; });
    }
    load();
    return h('section', null,
      h('h2', null, 'מאגר מפתחות Gemini'),
      h('p', { class: 'sub' }, 'הוסף מפתחות API לשימוש עתידי. מפתחות מוצפנים במסד הנתונים ואינם נחשפים בממשק.'),
      h('label', { class: 'f' }, 'תיאור'), label,
      h('label', { class: 'f' }, 'מפתח API'), key,
      h('div', { class: 'bar' }, h('button', { onclick: add }, 'הוסף מפתח למאגר')),
      status, rows);
  }

  function databasePanel() {
    var box = h('section', null,
      h('h2', null, 'חיבור למסד הנתונים'),
      h('p', { class: 'sub' }, 'בדיקת חיבור ושמירת נתונים ב-Neon.'),
      h('div', { class: 'bar' }, h('button', { class: 'quiet', onclick: check }, 'בדיקת חיבור')));
    function check() {
      box.querySelector('.sub').textContent = 'בודק חיבור...';
      api('GET', 'database').then(function (d) {
        box.querySelector('.sub').textContent = 'מחובר. פרופילי מתקשרים: ' + d.caller_profiles + '. תמלילים: ' + d.transcripts + '. בדיקה: ' + new Date(d.checked_at).toLocaleString('he-IL');
      }).catch(function (e) { box.querySelector('.sub').textContent = 'בדיקת החיבור נכשלה: ' + e.message; });
    }
    check();
    return box;
  }

  function render() { app.replaceChildren(header(), notificationsPanel(), callersPanel(), keyPoolPanel(), databasePanel(), settingsPanel(), transcriptsPanel(), eventsPanel()); }
  function load() {
    return api('GET', 'state').then(function (j) { S = j; render(); }).catch(function (e) { if (e.message !== 'auth') say(e.message, true); });
  }

  fetch('/admin/api/whoami', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
    googleLoginEnabled = !!j.google_enabled;
    if (!j.enabled) { app.replaceChildren(h('div', { class: 'login' }, h('h1', null, 'ניהול העוזר הקולי'), h('p', { class: 'sub' }, 'ממשק הניהול כבוי. הגדר ב-Render משתנה סביבה בשם ADMIN_PASSWORD כדי להפעיל אותו.'))); return; }
    if (j.auth) load(); else showLogin();
  });
})();
</script>
</body>
</html>
