<!doctype html>
<html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>האזור האישי</title>
<style>body{font:16px system-ui;background:#edf0ec;color:#16222e;margin:0;padding:24px}main{max-width:700px;margin:auto}section{background:white;border:1px solid #ccd4ce;border-radius:12px;padding:20px;margin:16px 0}input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #aab5ad}input{display:block;width:100%;box-sizing:border-box;margin:8px 0 14px}button{background:#1d4e89;color:white;cursor:pointer}article{border-top:1px solid #ddd;padding:14px 0;white-space:pre-wrap}.muted{color:#566660}</style>
<main id="app"><section><h1>כניסה לאזור האישי</h1><label>מספר טלפון<input id="phone" inputmode="tel" autocomplete="tel"></label><label>קוד אישי<input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></label><button id="login">כניסה</button><p id="msg" role="status"></p></section></main>
<script>
const app=document.getElementById('app'),msg=document.getElementById('msg');
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json','X-Requested-With':'personal',...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'שגיאה');return j}
async function load(){try{const d=await api('/personal/api/profile');const p=d.profile;app.replaceChildren();const box=document.createElement('section');const title=document.createElement('h1');title.textContent='האזור האישי – '+(p.name||p.phone);box.append(title);const details=document.createElement('p');details.className='muted';details.textContent='טלפון: '+p.phone+' · סגנון העוזר: '+p.assistant_mode+(p.assigned_address?' · כתובת: '+p.assigned_address:'');box.append(details);const out=document.createElement('button');out.textContent='יציאה';out.onclick=async()=>{await api('/personal/logout',{method:'POST'});location.reload()};box.append(out);app.append(box);const change=document.createElement('section');const ch=document.createElement('h2');ch.textContent='שינוי קוד אישי';change.append(ch);const oldPin=document.createElement('input');oldPin.type='password';oldPin.inputMode='numeric';oldPin.placeholder='הקוד הנוכחי';oldPin.autocomplete='current-password';const newPin=document.createElement('input');newPin.type='password';newPin.inputMode='numeric';newPin.placeholder='קוד חדש – 6 עד 12 ספרות';newPin.autocomplete='new-password';const savePin=document.createElement('button');savePin.textContent='עדכון קוד';const pinMsg=document.createElement('p');savePin.onclick=async()=>{try{await api('/personal/api/pin',{method:'POST',body:JSON.stringify({old_pin:oldPin.value,new_pin:newPin.value})});oldPin.value='';newPin.value='';pinMsg.textContent='הקוד האישי עודכן';}catch(e){pinMsg.textContent=e.message}};change.append(oldPin,newPin,savePin,pinMsg);app.append(change);if(p.history_enabled){const hist=document.createElement('section');const h=document.createElement('h2');h.textContent='היסטוריית שיחות';hist.append(h);(d.transcripts||[]).forEach(t=>{const a=document.createElement('article');a.textContent=new Date(t.created_at).toLocaleString('he-IL')+'\nהמשתמש: '+t.heard+'\nהעוזר: '+t.answer;hist.append(a)});if(!d.transcripts.length)hist.append('אין עדיין שיחות');app.append(hist)}}catch(e){msg.textContent=e.message}}
document.getElementById('login').onclick=async()=>{try{await api('/personal/login',{method:'POST',body:JSON.stringify({phone:document.getElementById('phone').value,pin:document.getElementById('pin').value})});await load()}catch(e){msg.textContent=e.message}};
fetch('/personal/api/profile').then(r=>{if(r.ok)load()});
</script></main></html>
